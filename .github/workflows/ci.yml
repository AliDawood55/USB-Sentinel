# USB Sentinel CI (Phase 14)
#
# Three platforms, four toolchains. The point of this workflow is not only to
# re-run the Windows suite that already passes locally: it is to put GCC and
# Clang in front of ~18,000 lines of C that had never seen a non-MSVC
# compiler, on every push, before the POSIX backend lands rather than after.
# That caught real defects the first time it ran (an unguarded MSVC
# `#pragma warning` sitting in the portable core, among others).
#
# Deliberately uses no third-party actions. Everything here is `actions/
# checkout` plus CMake and CTest, which are preinstalled on all three runner
# images - the same "prefer the first-party facility, take no dependency you
# do not need" stance ARCHITECTURE.md applies to the product itself (SetupAPI
# over WMI, CNG over a crypto library, no unit-test framework).
#
# Windows uses the Visual Studio generator rather than the repository's
# Ninja presets for one reason: Ninja needs cl.exe already on PATH, which
# needs a developer command prompt, which on a hosted runner means either a
# third-party action or hard-coding a Visual Studio edition path that varies
# between images. The compiler is identical either way. Local development
# keeps using the presets in CMakePresets.json.
#
# The generator is deliberately NOT named. The first version of this file
# pinned `-G "Visual Studio 17 2022"` and the Windows job failed to configure
# while all three POSIX jobs passed - the hosted image had moved on, which is
# the same class of fragility the paragraph above is already avoiding for the
# vcvars path. Letting CMake select the newest installed Visual Studio keeps
# this job working across image updates instead of pinning it to whatever was
# current the day it was written.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should never hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            # No -G: CMake picks the newest installed Visual Studio, so this
            # survives runner-image upgrades. Multi-config generator, hence
            # --config/-C rather than CMAKE_BUILD_TYPE.
            configure: -A x64
            build_args: --config Debug
            # Windows has the real platform backend, so it runs everything.
            ctest_args: -C Debug

          - name: linux-gcc
            os: ubuntu-latest
            configure: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc
            build_args: --parallel
            # Full suite: fs_posix.c has landed, so POSIX runs everything
            # Windows does (minus the Windows-only GUI tests, which are not
            # built here at all).
            ctest_args: ''

          - name: linux-clang
            os: ubuntu-latest
            configure: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang
            build_args: --parallel
            ctest_args: ''

          - name: macos-clang
            os: macos-latest
            configure: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang
            build_args: --parallel
            ctest_args: ''

          # AddressSanitizer + UndefinedBehaviorSanitizer over the whole
          # suite. Earns its place: on its first run it found a real
          # qsort(NULL, 0, ...) in signature_list.c - undefined behaviour that
          # every real qsort happens to tolerate, so no amount of passing
          # tests would ever have surfaced it. The project already runs MSVC's
          # ASan through its x64-asan preset; this is the POSIX counterpart,
          # and it additionally covers UBSan, which MSVC has no equivalent of.
          - name: linux-sanitizers
            os: ubuntu-latest
            # The inner quotes matter: `configure` is interpolated into a
            # bash command line, so an unquoted multi-word CMAKE_C_FLAGS
            # would word-split and silently drop everything after the first
            # flag into separate cmake arguments.
            configure: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -g" "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
            build_args: --parallel
            ctest_args: ''

    steps:
      - uses: actions/checkout@v4

      # The compiler is selected through CMAKE_C_COMPILER in the matrix's
      # configure arguments rather than a CC environment variable, so the
      # Windows entry - which names no compiler - does not end up with CC set
      # to the empty string.
      - name: Report toolchain
        shell: bash
        run: |
          cmake --version | head -1
          # Records which Visual Studio the image actually ships, so a future
          # configure failure here is diagnosable from the log rather than by
          # bisecting generator strings.
          if [ "${{ runner.os }}" = "Windows" ]; then
            vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            if [ -x "${vswhere}" ]; then
              "${vswhere}" -latest -property catalog_productLineVersion
              "${vswhere}" -latest -property installationVersion
            fi
          fi

      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.configure }}

      - name: Build
        shell: bash
        run: cmake --build build ${{ matrix.build_args }}

      - name: Test
        shell: bash
        env:
          # Harmless on the non-sanitizer jobs, which simply ignore them.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure ${{ matrix.ctest_args }}

  # Phase 14b (ARCHITECTURE.md section 21): the honest testing boundary this
  # phase settled on is that CI proves the NEGATIVE path - a non-USB block
  # device is never misclassified as USB - and real hardware, via community
  # beta testers (section 21.4), verifies the POSITIVE path. This job is that
  # negative-path proof, using a real (if virtual) loop-backed block device,
  # not a fixture: tests/test_device_linux.c already covers this same rule
  # deterministically against a fake sysfs tree, but this additionally proves
  # it against the actual kernel's own sysfs/mountinfo for a device this
  # workflow creates for real, the same "prove it against reality, not just
  # a mock" step test_platform.c's test_live_enumeration() already takes one
  # level down (against whatever real disks the runner happens to have).
  #
  # A separate job, not folded into the linux-gcc build above: this one
  # calls sudo and manipulates real kernel block-device state (losetup,
  # mkfs, mount), which is a materially different kind of step from
  # "build and run the unit tests," and keeping it apart means a failure
  # here is never confused with an ordinary test regression.
  linux-loopdev-negative-path:
    name: linux-loopdev-negative-path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel --target usb_sentinel

      - name: Create a loop-backed block device and confirm it is not misclassified as USB
        shell: bash
        run: |
          set -e

          IMG="$(mktemp /tmp/usbs-loopimg.XXXXXX)"
          MOUNTPOINT="$(mktemp -d /tmp/usbs-loopmnt.XXXXXX)"
          # losetup/mkfs/mount need root; reading the resulting sysfs
          # attributes and /proc/self/mountinfo (what usb-sentinel itself
          # does) needs none, so only the setup below runs under sudo.
          fallocate -l 16M "$IMG"
          LOOPDEV="$(sudo losetup --find --show "$IMG")"
          echo "created ${LOOPDEV} backed by ${IMG}"

          cleanup() {
            sudo umount "${MOUNTPOINT}" 2>/dev/null || true
            sudo losetup -d "${LOOPDEV}" 2>/dev/null || true
            rm -f "${IMG}"
            rmdir "${MOUNTPOINT}" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Formatted and mounted, not left bare: this also exercises the
          # mountinfo-matching path (mount_points/filesystem/volume_path)
          # against a real mount table entry, not only the bus_type check.
          sudo mkfs.ext4 -q "${LOOPDEV}"
          sudo mount "${LOOPDEV}" "${MOUNTPOINT}"
          sudo chmod 755 "${MOUNTPOINT}"

          OUTPUT="$(./build/src/app/usb-sentinel devices --all)"
          echo "${OUTPUT}"

          # cmd_devices.c prints "    volume      <path>" then, a few lines
          # later, "    bus         <name>" for the same device - grep -A
          # over the matching volume line is what finds that device's own
          # bus line, rather than the first "bus" line in the whole listing.
          BUS_LINE="$(echo "${OUTPUT}" | grep -A4 "volume .*${MOUNTPOINT}" | grep "bus ")"
          echo "bus line: ${BUS_LINE}"

          if [ -z "${BUS_LINE}" ]; then
            echo "::error::could not find the loop device's own 'bus' line in 'devices --all' output"
            exit 1
          fi
          if ! echo "${BUS_LINE}" | grep -q "unknown"; then
            echo "::error::loop device ${LOOPDEV} was not reported as bus 'unknown': ${BUS_LINE}"
            exit 1
          fi
          if echo "${BUS_LINE}" | grep -qi "usb"; then
            echo "::error::loop device ${LOOPDEV} was misclassified as USB: ${BUS_LINE}"
            exit 1
          fi
          echo "OK: loop device correctly reported as bus 'unknown', never USB"

  # The macOS analogue of linux-loopdev-negative-path, above: a real (if
  # virtual) disk image, attached via hdiutil rather than losetup, proving
  # device_macos.c's DiskArbitration-derived DeviceProtocol classification
  # does not misreport a non-USB-ancestored volume as USB. hdiutil-attached
  # images report a DeviceProtocol of their own (not "USB"), so - exactly
  # like a Linux loop device having no sysfs USB ancestor - this is a
  # structurally guaranteed negative case, not a probabilistic one.
  #
  # This is the ONLY verification device_macos.c gets before being trusted:
  # there is no Mac available to build it on ahead of pushing, unlike every
  # other file in Phase 14b (ARCHITECTURE.md section 21.3). If this job's
  # Build step itself fails, that is the most likely outcome and the most
  # important thing to read from this job - not the negative-path assertion
  # after it.
  macos-hdiutil-negative-path:
    name: macos-hdiutil-negative-path
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel --target usb_sentinel

      - name: Create a disk image and confirm it is not misclassified as USB
        shell: bash
        run: |
          set -e

          IMG="$(mktemp /tmp/usbs-dmg.XXXXXX).dmg"
          rm -f "${IMG}" # hdiutil create refuses to overwrite an existing file
          hdiutil create -size 16m -fs "APFS" -volname "USBSNegPath" "${IMG}"

          ATTACH_OUTPUT="$(hdiutil attach "${IMG}" -nobrowse)"
          echo "${ATTACH_OUTPUT}"
          # hdiutil attach prints one line per created device node (a GPT
          # scheme line, an APFS container line, ...); exactly one of them
          # also carries a "/Volumes/<name>" mount path, in a column
          # position that varies with how many partition/container lines
          # precede it. Grepping the /Volumes/ substring directly, rather
          # than assuming a fixed column, avoids depending on that count -
          # this project's volname ("USBSNegPath") is deliberately
          # space-free, so a plain whitespace split on it is safe.
          MOUNTPOINT="$(echo "${ATTACH_OUTPUT}" | grep -o '/Volumes/[^[:space:]]*' | head -1)"
          DEVNODE="$(echo "${ATTACH_OUTPUT}" | grep -F "${MOUNTPOINT}" | awk '{print $1}')"
          echo "mounted ${DEVNODE} at ${MOUNTPOINT}"

          if [ -z "${MOUNTPOINT}" ] || [ -z "${DEVNODE}" ]; then
            echo "::error::could not parse a mounted volume out of 'hdiutil attach' output"
            exit 1
          fi

          cleanup() {
            hdiutil detach "${DEVNODE}" 2>/dev/null || true
            rm -f "${IMG}"
          }
          trap cleanup EXIT

          OUTPUT="$(./build/src/app/usb-sentinel devices --all)"
          echo "${OUTPUT}"

          # cmd_devices.c prints "    volume      <path>" then, a few lines
          # later, "    bus         <name>" for the same device.
          BUS_LINE="$(echo "${OUTPUT}" | grep -A4 "volume .*${MOUNTPOINT}" | grep "bus ")"
          echo "bus line: ${BUS_LINE}"

          if [ -z "${BUS_LINE}" ]; then
            echo "::error::could not find the disk image's own 'bus' line in 'devices --all' output"
            exit 1
          fi
          if echo "${BUS_LINE}" | grep -qi "usb"; then
            echo "::error::disk image ${DEVNODE} was misclassified as USB: ${BUS_LINE}"
            exit 1
          fi
          echo "OK: disk image correctly not classified as USB (bus: $(echo "${BUS_LINE}" | awk '{print $2}'))"

  # Phase 16 (ARCHITECTURE.md section 22.8): the socket-facing half of
  # src/gui_web/ - the actual accept()/recv() loop, real Host-header
  # validation, real routing - is exactly the part tests/
  # test_http_server.c's own header explains a fixture cannot
  # meaningfully cover, the same "pure logic tested directly, real I/O
  # tested separately" split test_device_linux.c already uses for
  # device_linux.c's mountinfo parsing. This job is the "real I/O" half:
  # it builds the actual usb-sentinel-gui-web binary, starts it for
  # real, and drives its API with curl.
  #
  # Deliberately scoped to auth and routing, not a full scan cycle: a
  # loop device (this job's only available "disk" in CI) is bus
  # "unknown", not USB, so it never appears in GET /api/devices at all
  # (gui_web_app.c's handle_devices() only lists USB_BUS_USB devices,
  # same filter the CLI's plain `devices` - not `--all` - already
  # applies) - reaching it would mean this workflow re-deriving
  # usbs_store_safe_id()'s exact byte-escaping rule by hand just to
  # target a request at a device this test cannot realistically obtain
  # any other way, which is more fragile than it is worth. A full real
  # scan through this exact HTTP path (a real loop-mounted ext4
  # filesystem, POST /api/scan through GET /api/report, JSON+CSV
  # confirmed written to disk) was verified locally before this phase
  # was trusted - see ARCHITECTURE.md section 22.8 - and gui_worker.c's
  # own scan orchestration is exercised on every CI run regardless, by
  # tests/test_gui_worker.c (now portable and running here too, since
  # this same phase moved it off Windows-only - section 22.4).
  linux-web-gui-curl:
    name: linux-web-gui-curl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel --target usb_sentinel_gui_web

      - name: Start the server and exercise it with curl
        shell: bash
        run: |
          set -e

          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export XDG_DATA_HOME="$(mktemp -d)"

          ./build/src/app_gui_web/usb-sentinel-gui-web > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT

          sleep 1
          cat server.log
          URL="$(grep -o 'http://[^ ]*' server.log | head -1)"
          if [ -z "${URL}" ]; then
            echo "::error::server never printed its launch URL"
            exit 1
          fi
          TOKEN="$(echo "${URL}" | grep -o 'token=.*' | cut -d= -f2)"
          PORT="$(echo "${URL}" | sed -E 's#http://127\.0\.0\.1:([0-9]+).*#\1#')"

          # $1: expected HTTP status, remaining args: passed straight to curl.
          check_status() {
            local expected="$1"; shift
            local actual
            actual="$(curl -s -o /dev/null -w '%{http_code}' "$@")"
            if [ "${actual}" != "${expected}" ]; then
              echo "::error::expected HTTP ${expected}, got ${actual} for: curl $*"
              exit 1
            fi
          }

          check_status 200 "${URL}"
          check_status 403 "http://127.0.0.1:${PORT}/?token=wrong-token"
          # DNS-rebinding simulation: right token, forged Host header.
          check_status 403 -H "Host: evil.example.com" "http://127.0.0.1:${PORT}/?token=${TOKEN}"
          check_status 403 "http://127.0.0.1:${PORT}/api/devices"
          check_status 404 -H "X-USBSentinel-Token: ${TOKEN}" "http://127.0.0.1:${PORT}/no-such-route"
          check_status 404 -H "X-USBSentinel-Token: ${TOKEN}" "http://127.0.0.1:${PORT}/api/report"
          check_status 200 -H "X-USBSentinel-Token: ${TOKEN}" -X POST "http://127.0.0.1:${PORT}/api/cancel"

          DEVICES_JSON="$(curl -s -H "X-USBSentinel-Token: ${TOKEN}" -H "Accept: application/json" -H "User-Agent: ci-test" "http://127.0.0.1:${PORT}/api/devices")"
          echo "devices: ${DEVICES_JSON}"
          echo "${DEVICES_JSON}" | grep -qE '^\[.*\]$' || (echo "::error::GET /api/devices did not return a JSON array"; exit 1)

          PROGRESS_JSON="$(curl -s -H "X-USBSentinel-Token: ${TOKEN}" "http://127.0.0.1:${PORT}/api/progress")"
          echo "progress: ${PROGRESS_JSON}"
          echo "${PROGRESS_JSON}" | grep -q '"busy":false' || (echo "::error::idle server did not report busy:false"; exit 1)

          kill -TERM "${SERVER_PID}"
          if ! wait "${SERVER_PID}" 2>/dev/null; then
            true # SIGTERM exit status varies by shell; reaching here at all means it stopped
          fi
          echo "OK: web GUI server handled auth, Host validation, and its fixed routes correctly over a real socket"
