# USB Sentinel CI (Phase 14)
#
# Three platforms, four toolchains. The point of this workflow is not only to
# re-run the Windows suite that already passes locally: it is to put GCC and
# Clang in front of ~18,000 lines of C that had never seen a non-MSVC
# compiler, on every push, before the POSIX backend lands rather than after.
# That caught real defects the first time it ran (an unguarded MSVC
# `#pragma warning` sitting in the portable core, among others).
#
# Deliberately uses no third-party actions. Everything here is `actions/
# checkout` plus CMake and CTest, which are preinstalled on all three runner
# images - the same "prefer the first-party facility, take no dependency you
# do not need" stance ARCHITECTURE.md applies to the product itself (SetupAPI
# over WMI, CNG over a crypto library, no unit-test framework).
#
# Windows uses the Visual Studio generator rather than the repository's
# Ninja presets for one reason: Ninja needs cl.exe already on PATH, which
# needs a developer command prompt, which on a hosted runner means either a
# third-party action or hard-coding a Visual Studio edition path that varies
# between images. The compiler is identical either way. Local development
# keeps using the presets in CMakePresets.json.
#
# The generator is deliberately NOT named. The first version of this file
# pinned `-G "Visual Studio 17 2022"` and the Windows job failed to configure
# while all three POSIX jobs passed - the hosted image had moved on, which is
# the same class of fragility the paragraph above is already avoiding for the
# vcvars path. Letting CMake select the newest installed Visual Studio keeps
# this job working across image updates instead of pinning it to whatever was
# current the day it was written.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      # One platform failing should never hide the state of the other two.
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            # No -G: CMake picks the newest installed Visual Studio, so this
            # survives runner-image upgrades. Multi-config generator, hence
            # --config/-C rather than CMAKE_BUILD_TYPE.
            configure: -A x64
            build_args: --config Debug
            # Windows has the real platform backend, so it runs everything.
            ctest_args: -C Debug

          - name: linux-gcc
            os: ubuntu-latest
            configure: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc
            build_args: --parallel
            # Full suite: fs_posix.c has landed, so POSIX runs everything
            # Windows does (minus the Windows-only GUI tests, which are not
            # built here at all).
            ctest_args: ''

          - name: linux-clang
            os: ubuntu-latest
            configure: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang
            build_args: --parallel
            ctest_args: ''

          - name: macos-clang
            os: macos-latest
            configure: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang
            build_args: --parallel
            ctest_args: ''

          # AddressSanitizer + UndefinedBehaviorSanitizer over the whole
          # suite. Earns its place: on its first run it found a real
          # qsort(NULL, 0, ...) in signature_list.c - undefined behaviour that
          # every real qsort happens to tolerate, so no amount of passing
          # tests would ever have surfaced it. The project already runs MSVC's
          # ASan through its x64-asan preset; this is the POSIX counterpart,
          # and it additionally covers UBSan, which MSVC has no equivalent of.
          - name: linux-sanitizers
            os: ubuntu-latest
            # The inner quotes matter: `configure` is interpolated into a
            # bash command line, so an unquoted multi-word CMAKE_C_FLAGS
            # would word-split and silently drop everything after the first
            # flag into separate cmake arguments.
            configure: -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer -g" "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
            build_args: --parallel
            ctest_args: ''

    steps:
      - uses: actions/checkout@v4

      # The compiler is selected through CMAKE_C_COMPILER in the matrix's
      # configure arguments rather than a CC environment variable, so the
      # Windows entry - which names no compiler - does not end up with CC set
      # to the empty string.
      - name: Report toolchain
        shell: bash
        run: |
          cmake --version | head -1
          # Records which Visual Studio the image actually ships, so a future
          # configure failure here is diagnosable from the log rather than by
          # bisecting generator strings.
          if [ "${{ runner.os }}" = "Windows" ]; then
            vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
            if [ -x "${vswhere}" ]; then
              "${vswhere}" -latest -property catalog_productLineVersion
              "${vswhere}" -latest -property installationVersion
            fi
          fi

      - name: Configure
        shell: bash
        run: cmake -S . -B build ${{ matrix.configure }}

      - name: Build
        shell: bash
        run: cmake --build build ${{ matrix.build_args }}

      - name: Test
        shell: bash
        env:
          # Harmless on the non-sanitizer jobs, which simply ignore them.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure ${{ matrix.ctest_args }}

  # Phase 14b (ARCHITECTURE.md section 21): the honest testing boundary this
  # phase settled on is that CI proves the NEGATIVE path - a non-USB block
  # device is never misclassified as USB - and real hardware, via community
  # beta testers (section 21.4), verifies the POSITIVE path. This job is that
  # negative-path proof, using a real (if virtual) loop-backed block device,
  # not a fixture: tests/test_device_linux.c already covers this same rule
  # deterministically against a fake sysfs tree, but this additionally proves
  # it against the actual kernel's own sysfs/mountinfo for a device this
  # workflow creates for real, the same "prove it against reality, not just
  # a mock" step test_platform.c's test_live_enumeration() already takes one
  # level down (against whatever real disks the runner happens to have).
  #
  # A separate job, not folded into the linux-gcc build above: this one
  # calls sudo and manipulates real kernel block-device state (losetup,
  # mkfs, mount), which is a materially different kind of step from
  # "build and run the unit tests," and keeping it apart means a failure
  # here is never confused with an ordinary test regression.
  linux-loopdev-negative-path:
    name: linux-loopdev-negative-path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure and build
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build --parallel --target usb_sentinel

      - name: Create a loop-backed block device and confirm it is not misclassified as USB
        shell: bash
        run: |
          set -e

          IMG="$(mktemp /tmp/usbs-loopimg.XXXXXX)"
          MOUNTPOINT="$(mktemp -d /tmp/usbs-loopmnt.XXXXXX)"
          # losetup/mkfs/mount need root; reading the resulting sysfs
          # attributes and /proc/self/mountinfo (what usb-sentinel itself
          # does) needs none, so only the setup below runs under sudo.
          fallocate -l 16M "$IMG"
          LOOPDEV="$(sudo losetup --find --show "$IMG")"
          echo "created ${LOOPDEV} backed by ${IMG}"

          cleanup() {
            sudo umount "${MOUNTPOINT}" 2>/dev/null || true
            sudo losetup -d "${LOOPDEV}" 2>/dev/null || true
            rm -f "${IMG}"
            rmdir "${MOUNTPOINT}" 2>/dev/null || true
          }
          trap cleanup EXIT

          # Formatted and mounted, not left bare: this also exercises the
          # mountinfo-matching path (mount_points/filesystem/volume_path)
          # against a real mount table entry, not only the bus_type check.
          sudo mkfs.ext4 -q "${LOOPDEV}"
          sudo mount "${LOOPDEV}" "${MOUNTPOINT}"
          sudo chmod 755 "${MOUNTPOINT}"

          OUTPUT="$(./build/src/app/usb-sentinel devices --all)"
          echo "${OUTPUT}"

          # cmd_devices.c prints "    volume      <path>" then, a few lines
          # later, "    bus         <name>" for the same device - grep -A
          # over the matching volume line is what finds that device's own
          # bus line, rather than the first "bus" line in the whole listing.
          BUS_LINE="$(echo "${OUTPUT}" | grep -A4 "volume .*${MOUNTPOINT}" | grep "bus ")"
          echo "bus line: ${BUS_LINE}"

          if [ -z "${BUS_LINE}" ]; then
            echo "::error::could not find the loop device's own 'bus' line in 'devices --all' output"
            exit 1
          fi
          if ! echo "${BUS_LINE}" | grep -q "unknown"; then
            echo "::error::loop device ${LOOPDEV} was not reported as bus 'unknown': ${BUS_LINE}"
            exit 1
          fi
          if echo "${BUS_LINE}" | grep -qi "usb"; then
            echo "::error::loop device ${LOOPDEV} was misclassified as USB: ${BUS_LINE}"
            exit 1
          fi
          echo "OK: loop device correctly reported as bus 'unknown', never USB"
